<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #0a0e13;
    --panel: #10161d;
    --line: #22303c;
    --cyan: #4fd6c8;
    --amber: #f2a340;
    --text: #cfe3e6;
    --text-dim: #6f8790;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    overflow: hidden;
  }
  #scene { position: absolute; inset: 0; }
  canvas { display: block; }

  .hud {
    position: absolute;
    top: 16px;
    left: 16px;
    background: rgba(16, 22, 29, 0.82);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 18px;
    min-width: 220px;
    backdrop-filter: blur(2px);
  }
  .hud h1 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin: 0 0 10px 0;
    color: var(--cyan);
  }
  .row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    line-height: 1.9;
    color: var(--text-dim);
    gap: 18px;
  }
  .row span.val {
    color: var(--text);
  }
  .row span.val.amber { color: var(--amber); }
  .phase-badge {
    display: inline-block;
    margin-top: 8px;
    padding: 2px 8px;
    border: 1px solid var(--line);
    border-radius: 3px;
    font-size: 11px;
    letter-spacing: 0.03em;
    color: var(--cyan);
  }

  .controls {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(16, 22, 29, 0.88);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    width: min(640px, 84vw);
  }
  button#playBtn {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--cyan);
    font-family: inherit;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.03em;
  }
  button#playBtn:hover { border-color: var(--cyan); }
  input[type="range"] {
    flex: 1;
    accent-color: var(--cyan);
  }
  #timeLabel {
    font-size: 11px;
    color: var(--text-dim);
    width: 64px;
    text-align: right;
  }
  select#speed {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    font-family: inherit;
    font-size: 11px;
    border-radius: 4px;
    padding: 4px;
  }

  .legend {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(16, 22, 29, 0.82);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 14px;
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.8;
  }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
</style>
</head>
<body>

<div id="scene"></div>

<div class="hud">
  <h1>TRACKER — LIVE POINTING</h1>
  <div class="row"><span>T+</span><span class="val" id="hudTime">0.0 s</span></div>
  <div class="row"><span>YAW</span><span class="val amber" id="hudYaw">0.0°</span></div>
  <div class="row"><span>PITCH</span><span class="val amber" id="hudPitch">0.0°</span></div>
  <div class="row"><span>ALTITUDE</span><span class="val" id="hudAlt">0 m</span></div>
  <div class="row"><span>RANGE</span><span class="val" id="hudRange">0 m</span></div>
  <div class="phase-badge" id="hudPhase">STANDBY</div>
</div>

<div class="legend">
  <div><span class="dot" style="background:var(--cyan)"></span>Flight path</div>
  <div><span class="dot" style="background:var(--amber)"></span>Rocket</div>
  <div><span class="dot" style="background:#8a97a3"></span>Antenna / tower</div>
</div>

<div class="controls">
  <button id="playBtn">▶ PLAY</button>
  <input type="range" id="scrub" min="0" max="1" step="0.001" value="0" />
  <span id="timeLabel">0.0 s</span>
  <select id="speed">
    <option value="1">1×</option>
    <option value="2">2×</option>
    <option value="5" selected>5×</option>
    <option value="10">10×</option>
  </select>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

// Scene setup

const container = document.getElementById('scene');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0e13, 0.00012);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 40000);
let camDist = 6500, camYaw = 0.7, camPitch = 0.35;
function updateCamera() {
  camera.position.set(
    camDist * Math.sin(camYaw) * Math.cos(camPitch),
    camDist * Math.sin(camPitch) + 400,
    camDist * Math.cos(camYaw) * Math.cos(camPitch)
  );
  camera.lookAt(0, 900, 600);
}
updateCamera();

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0a0e13);
container.appendChild(renderer.domElement);

// manual orbit controls (drag to rotate, wheel to zoom) — no OrbitControls dependency
let dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mouseup', () => dragging = false);
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  camYaw -= (e.clientX - lastX) * 0.005;
  camPitch = Math.max(0.05, Math.min(1.4, camPitch + (e.clientY - lastY) * 0.005));
  lastX = e.clientX; lastY = e.clientY;
  updateCamera();
});
renderer.domElement.addEventListener('wheel', e => {
  camDist = Math.max(800, Math.min(16000, camDist + e.deltaY * 2));
  updateCamera();
}, { passive: true });

const groundMat = new THREE.MeshBasicMaterial({ color: 0x0d1319, transparent: true, opacity: 0.6 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(12000, 12000), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1;
scene.add(ground);

// helper: (east, north, alt) -> three.js (x, y, z). North = -Z, East = +X, Up = +Y
function toScene(east, north, alt) {
  return new THREE.Vector3(east, alt, -north);
}

// flight path line, colored boost(amber)->coast/descent(cyan) by altitude trend
const pathPts = TRAJECTORY.map(([t, e, n, a]) => toScene(e, n, a));
const pathGeom = new THREE.BufferGeometry().setFromPoints(pathPts);
const pathLine = new THREE.Line(pathGeom, new THREE.LineBasicMaterial({ color: 0x4fd6c8, transparent: true, opacity: 0.55 }));
scene.add(pathLine);

// tower marker
const towerPos = toScene(TOWER_POS.east, TOWER_POS.north, 0);
const towerMesh = new THREE.Mesh(
  new THREE.ConeGeometry(18, 60, 8),
  new THREE.MeshStandardMaterial({ color: 0x8a97a3 })
);
towerMesh.position.copy(towerPos).add(new THREE.Vector3(0, 30, 0));
scene.add(towerMesh);

  new THREE.MeshStandardMaterial({ color: 0x1b2530 })
);
base.position.set(0, 25, 0);
scene.add(base);

const azimuthGroup = new THREE.Group();
azimuthGroup.position.set(0, 55, 0);
scene.add(azimuthGroup);

const pivotRing = new THREE.Mesh(
  new THREE.TorusGeometry(45, 6, 8, 24),
  new THREE.MeshStandardMaterial({ color: 0x4fd6c8, emissive: 0x113330 })
);
pivotRing.rotation.x = Math.PI / 2;
azimuthGroup.add(pivotRing);

const elevationGroup = new THREE.Group();
azimuthGroup.add(elevationGroup);

const arm = new THREE.Mesh(
  new THREE.BoxGeometry(14, 14, 160),
  new THREE.MeshStandardMaterial({ color: 0x2c3b47 })
);
arm.position.z = 80; // extends forward along local +Z
elevationGroup.add(arm);

const dish = new THREE.Mesh(
  new THREE.ConeGeometry(28, 46, 20, 1, true),
  new THREE.MeshStandardMaterial({ color: 0xf2a340, emissive: 0x3a2508, side: THREE.DoubleSide })
);
dish.rotation.x = -Math.PI / 2;
dish.position.z = 165;
elevationGroup.add(dish);

// pointing beam toward the rocket, dashed for a "targeting" feel
const beamGeom = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
const beamMat = new THREE.LineDashedMaterial({ color: 0xf2a340, dashSize: 40, gapSize: 24, transparent: true, opacity: 0.8 });
const beam = new THREE.Line(beamGeom, beamMat);
scene.add(beam);

// Transparent antenna aperture cone, centered on the dish axis and carried
// by the elevation/azimuth gimbal so it always follows dish motion.
const apertureCone = new THREE.Mesh(
  new THREE.ConeGeometry(1500, 12000, 64, 1, true, 0, Math.PI * 2),
  new THREE.MeshBasicMaterial({
    color: 0xf2a340,
    transparent: true,
    opacity: 0.12,
    depthWrite: false,
    side: THREE.DoubleSide
  })
);
apertureCone.rotation.x = -Math.PI / 2;
apertureCone.position.set(0, 0, 0);
elevationGroup.add(apertureCone);

// rocket marker
const rocket = new THREE.Mesh(
  new THREE.SphereGeometry(24, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xf2a340, emissive: 0x3a2508 })
);
scene.add(rocket);

const socket = io();
let latestFusion = null;
let latestTelemetry = {};

socket.on('tracker_update', payload => {
  latestFusion = payload;

  if (!payload) return;

  const yaw = Number(payload.yaw_cmd || 0);
  const pitch = Number(payload.pitch_cmd || 0);
  const targetPos = toScene(payload.fused_x || 0, payload.fused_y || 0, payload.fused_alt || 0);

  rocket.position.copy(targetPos);
  azimuthGroup.rotation.y = THREE.MathUtils.degToRad(yaw);
  elevationGroup.rotation.x = -THREE.MathUtils.degToRad(pitch);

  document.getElementById('hudYaw').textContent = yaw.toFixed(1) + '°';
  document.getElementById('hudPitch').textContent = pitch.toFixed(1) + '°';
  document.getElementById('hudAlt').textContent = Math.round(payload.fused_alt || 0).toLocaleString() + ' m';
  document.getElementById('hudRange').textContent = Math.round(payload.ground_range || 0).toLocaleString() + ' m';

  updateCoverageAndBeam(targetPos);
});

socket.on('telemetry_update', packet => {
  latestTelemetry[packet.sensor] = packet.value;
});

// ---------------------------------------------------------------------
// Trajectory sampling + playback
// ---------------------------------------------------------------------
const tMin = TRAJECTORY[0][0];
const tMax = TRAJECTORY[TRAJECTORY.length - 1][0];

function sampleAt(t) {
  if (t <= tMin) return TRAJECTORY[0];
  if (t >= tMax) return TRAJECTORY[TRAJECTORY.length - 1];
  let lo = 0, hi = TRAJECTORY.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (TRAJECTORY[mid][0] <= t) lo = mid; else hi = mid;
  }
  const [t0, e0, n0, a0] = TRAJECTORY[lo];
  const [t1, e1, n1, a1] = TRAJECTORY[hi];
  const f = (t - t0) / (t1 - t0 || 1);
  return [t, e0 + (e1 - e0) * f, n0 + (n1 - n0) * f, a0 + (a1 - a0) * f];
}

function phaseFor(t) {
  if (t < 4) return 'BOOST';
  if (t < 45.3) return 'COAST';
  return 'DESCENT';
}

let simTime = tMin;
let playing = false;
let speed = 5;

const playBtn = document.getElementById('playBtn');
const scrub = document.getElementById('scrub');
const timeLabel = document.getElementById('timeLabel');
const speedSel = document.getElementById('speed');

playBtn.addEventListener('click', () => {
  playing = !playing;
  playBtn.textContent = playing ? '⏸ PAUSE' : '▶ PLAY';
});
scrub.addEventListener('input', () => {
  simTime = tMin + parseFloat(scrub.value) * (tMax - tMin);
  playing = false;
  playBtn.textContent = '▶ PLAY';
});
speedSel.addEventListener('change', () => speed = parseFloat(speedSel.value));

function updateCoverageAndBeam(targetPos) {
  if (!targetPos) return;

  const dishTip = new THREE.Vector3();
  dish.getWorldPosition(dishTip);

  // Dashed beam continues to track the fused target position.
  beam.geometry.setFromPoints([dishTip, targetPos]);
  beam.computeLineDistances();
}

function updatePointing(t) {
  if (latestFusion) {
    const targetPos = toScene(latestFusion.fused_x || 0, latestFusion.fused_y || 0, latestFusion.fused_alt || 0);
    rocket.position.copy(targetPos);

    const yaw = Number(latestFusion.yaw_cmd || 0);
    const pitch = Number(latestFusion.pitch_cmd || 0);
    azimuthGroup.rotation.y = THREE.MathUtils.degToRad(yaw);
    elevationGroup.rotation.x = -THREE.MathUtils.degToRad(pitch);

    const dishTip = new THREE.Vector3();
    dish.getWorldPosition(dishTip);
    beam.geometry.setFromPoints([dishTip, targetPos]);
    beam.computeLineDistances();

    document.getElementById('hudTime').textContent = t.toFixed(1) + ' s';
    document.getElementById('hudYaw').textContent = yaw.toFixed(1) + '°';
    document.getElementById('hudPitch').textContent = pitch.toFixed(1) + '°';
    document.getElementById('hudAlt').textContent = Math.round(latestFusion.fused_alt || 0).toLocaleString() + ' m';
    document.getElementById('hudRange').textContent = Math.round(latestFusion.ground_range || 0).toLocaleString() + ' m';

    updateCoverageAndBeam(targetPos);
    return;
  }

  const [, east, north, alt] = sampleAt(t);
  const targetPos = toScene(east, north, alt);

  rocket.position.copy(targetPos);

  const dx = targetPos.x - gimbalOrigin.x;
  const dz = targetPos.z - gimbalOrigin.z;
  const dy = targetPos.y - azimuthGroup.position.y;
  const groundRange = Math.sqrt(dx * dx + dz * dz);
  const yawRad = Math.atan2(dx, -dz); // 0 = north (-Z), + = east (+X), matches ENU bearing
  const pitchRad = Math.atan2(dy, groundRange);

  azimuthGroup.rotation.y = yawRad;
  elevationGroup.rotation.x = -pitchRad;

  const dishTip = new THREE.Vector3();
  dish.getWorldPosition(dishTip);
  beam.geometry.setFromPoints([dishTip, targetPos]);
  beam.computeLineDistances();

  updateCoverageAndBeam(targetPos);

  const yawDeg = ((yawRad * 180 / Math.PI) + 360) % 360;
  const pitchDeg = pitchRad * 180 / Math.PI;
  const range = Math.sqrt(groundRange * groundRange + dy * dy);

  document.getElementById('hudTime').textContent = t.toFixed(1) + ' s';
  document.getElementById('hudYaw').textContent = yawDeg.toFixed(1) + '°';
  document.getElementById('hudPitch').textContent = pitchDeg.toFixed(1) + '°';
  document.getElementById('hudAlt').textContent = Math.round(alt).toLocaleString() + ' m';
  document.getElementById('hudRange').textContent = Math.round(range).toLocaleString() + ' m';
  document.getElementById('hudPhase').textContent = phaseFor(t);

  scrub.value = (t - tMin) / (tMax - tMin);
  timeLabel.textContent = t.toFixed(1) + ' s';
}

// ---------------------------------------------------------------------
// Render loop
// ---------------------------------------------------------------------
let lastFrame = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = (now - lastFrame) / 1000;
  lastFrame = now;

  if (playing) {
    simTime += dt * speed;
    if (simTime >= tMax) { simTime = tMax; playing = false; playBtn.textContent = '▶ PLAY'; }
  }

  updatePointing(simTime);
  renderer.render(scene, camera);
}
updatePointing(simTime);
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
